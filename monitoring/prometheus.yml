global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ai-workforce-os'
    scrape_interval: 10s
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['backend:8000']
        labels:
          instance: 'ai-workforce-backend'
          environment: 'production'
