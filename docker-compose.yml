version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai-workforce-db
    environment:
      POSTGRES_USER: aiworkforce
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme-strong-password}
      POSTGRES_DB: ai_workforce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiworkforce"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-workforce-net

  redis:
    image: redis:7-alpine
    container_name: ai-workforce-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-workforce-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-workforce-backend
    ports:
      - "8000:8000"
    environment:
      - APP_DEBUG=false
      - API_KEY=${API_KEY:-change-this-to-strong-key-in-production}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-32-char-secret-in-production}
      - DATABASE_URL=postgresql+asyncpg://aiworkforce:${DB_PASSWORD:-changeme-strong-password}@db:5432/ai_workforce
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT=${RATE_LIMIT:-100/minute}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./movies:/app/movies
      - ./logs:/app/logs
      - ./knowledge:/app/knowledge:ro
    networks:
      - ai-workforce-net
    restart: unless-stopped

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-workforce-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ai-workforce-net
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: ai-workforce-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ai-workforce-net
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  ai-workforce-net:
    driver: bridge
