# Production Configuration Example
# Usage: docker-compose -f production-config.yml up -d

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-workforce-api-prod
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_DEBUG=false
      - LOG_LEVEL=WARNING
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: always
    networks:
      - ai-workforce-prod
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health/').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: ai-workforce-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ai_workforce
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always
    networks:
      - ai-workforce-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ai_workforce"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:

networks:
  ai-workforce-prod:
    driver: bridge
